[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "serves-me-right"
version = "0.0.1"
description = "Static browser for a Turtle knowledge graph."
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.1.4",
]

[project.scripts]
build-site = "serves_me_right.build_site:main"
serves-me-right-build = "serves_me_right.build_site:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
serves_me_right = [
    "site/*",
    "site/vendor/*",
]

[dependency-groups]

dev = [
    "ruff>=0.4.4,<0.5",
    "black",
]

[tool.uv]
default-groups = [
    "dev",
]
